name: Tool checks
on: [push, pull_request]
jobs:
  portable-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-vita.txt
      - run: python -m compileall -q tools
      - run: python -m unittest discover -s tools -p "test_*.py"
      - name: Compile Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:winexe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll /out:build/Patcher.exe installer/Program.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
