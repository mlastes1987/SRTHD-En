name: Test-build bug report
description: Report translation, text layout, paging, installer or gameplay problems.
title: "[Test build] "
body:
  - type: markdown
    attributes:
      value: "Thanks for testing! Current builds are available at https://discord.gg/DwR2jxj5b. Please do not attach game files or license keys."
  - type: dropdown
    id: platform
    attributes:
      label: Platform / title ID
      options:
        - PS3 / RPCS3 — NPJB00514
        - Vita3K — PCSG00260
        - Vita hardware / rePatch — PCSG00260
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Test-build version
    validations:
      required: true
  - type: input
    id: emulator
    attributes:
      label: Emulator version / operating system, or Vita firmware
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Episode, unit, attack or menu
      description: Include the exact dialogue or menu option if possible.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: What happened and how to reproduce it
      description: Explain what you expected and what appeared instead. Attach screenshots here if useful.
    validations:
      required: true
